name: Publish packages

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build core
        run: npm run build --workspace=@behrouzan/access-control

      - name: Build React package
        run: npm run build --workspace=@behrouzan/access-control-react

      - name: Publish core
        run: npm publish --workspace=@behrouzan/access-control --access public

      - name: Publish React package
        run: npm publish --workspace=@behrouzan/access-control-react --access public